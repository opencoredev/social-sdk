name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset
    # Package changes need a changeset so they ship through the version PR.
    # Only the bot-opened version PR is exempt.
    if: >-
      github.event_name == 'pull_request' &&
      !(github.head_ref == 'changeset-release/main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'github-actions[bot]')
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run changeset status --since=origin/${{ github.base_ref }}

  verify:
    name: Offline verification
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run release:ci
      - run: bun run test:node

  node-24:
    name: Node 24 tests
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run test:node
