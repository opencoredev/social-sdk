name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# No workflow-level grants. The release job lists the writes it needs.
permissions: {}

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Version or publish
    if: vars.SOCIAL_SDK_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      # changesets/action pushes the version branch and tags with the
      # credentials checkout persists, and creates GitHub releases.
      contents: write
      # Opens and updates the version pull request.
      pull-requests: write
      # OIDC token for npm trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.12.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing (OIDC) needs npm 11.5.1+; no npm token anywhere.
      - run: npm install -g npm@11
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/check-package.ts
      - name: Create version PR or publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: bun run version-packages
          publish: bun run release
          createGithubReleases: true
          commit: "chore: version package"
          title: "chore: version package"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          SOCIAL_SDK_RELEASE_AUTHORIZED: ${{ vars.SOCIAL_SDK_RELEASE_ENABLED }}
