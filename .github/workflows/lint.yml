name: Lint

# Runs on every push to any branch, not just main, so lint feedback lands
# seconds after a push instead of after the full release gate.
on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    # Fork pull requests cannot use the private runner label, so they fall back to GitHub's.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'tenki-standard-medium-4c-8g' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Oxlint (anti-slop)
        run: bun run lint
      - name: Anti-slop bundle sync
        run: bun scripts/check-anti-slop-bundle.ts
      - name: Format
        run: bun run format:check
