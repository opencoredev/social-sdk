name: Scorecard

# Runs the OpenSSF Scorecard checks and publishes the result to the public
# Scorecard API, so repository-health tools and the README badge can read it.
# Publishing only works from the default branch, and the Scorecard API rejects
# results unless this job stays on a GitHub-hosted Ubuntu runner, keeps
# workflow-level permissions read-only, and uses only the approved actions below.
on:
  push:
    branches:
      - main
  schedule:
    # Weekly, Saturday 01:30 UTC.
    - cron: "30 1 * * 6"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to code scanning.
      security-events: write
      # OIDC token that proves the result came from this workflow.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
